name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
        shell: pwsh
      - name: Build Windows application
        run: wails build -platform windows/amd64
        shell: pwsh
      - name: Package release artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path build/bin/eVoca.exe -DestinationPath "eVoca-$version-windows-amd64.zip"
          (Get-FileHash "eVoca-$version-windows-amd64.zip" -Algorithm SHA256).Hash + "  eVoca-$version-windows-amd64.zip" | Set-Content "SHA256SUMS"
      - name: Attest release artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: eVoca-${{ github.ref_name }}-windows-amd64.zip
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            eVoca-${{ github.ref_name }}-windows-amd64.zip
            SHA256SUMS

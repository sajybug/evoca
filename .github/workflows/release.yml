name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Prepare frontend dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/dist | Out-Null
          New-Item -ItemType File -Force frontend/dist/.gitkeep | Out-Null

      - name: Generate Wails bindings
        run: wails generate module

      - name: Build Windows application
        run: wails build -platform windows/amd64
        shell: pwsh

      - name: Verify build artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "build/bin/eVoca.exe")) {
            Write-Error "Build artifact not found: build/bin/eVoca.exe"
            exit 1
          }

      - name: Package release artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zip = "eVoca-$version-windows-amd64.zip"

          Compress-Archive `
            -Path "build/bin/eVoca.exe" `
            -DestinationPath $zip

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Set-Content "SHA256SUMS"

      - name: Attest release artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: eVoca-${{ github.ref_name }}-windows-amd64.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            eVoca-${{ github.ref_name }}-windows-amd64.zip
            SHA256SUMS
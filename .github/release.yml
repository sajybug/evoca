changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
      - question

  categories:
    - title: "✨ New Features"
      labels:
        - feature
        - enhancement

    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - bug-fix

    - title: "🔧 Improvements"
      labels:
        - improvement
        - refactor

    - title: "⚡ Performance"
      labels:
        - performance

    - title: "🔒 Security"
      labels:
        - security

    - title: "🧪 Tests"
      labels:
        - test

    - title: "📚 Documentation"
      labels:
        - documentation
        - docs

    - title: "🛠 Maintenance"
      labels:
        - maintenance
        - chore
        - dependencies

    - title: "📦 Other Changes"
      labels:
        - "*"